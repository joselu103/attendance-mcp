[project]
name = "attendance-mcp"
version = "0.1.0"
description = "Thin Streamable HTTP MCP adapter for Attendance CRMT REST."
requires-python = ">=3.12"
dependencies = [
    "fastmcp==3.4.5",
    "httpx>=0.28.1",
    "pydantic-settings>=2.14.2",
    "structlog>=25.5.0",
    "uvicorn>=0.41",
]

[project.scripts]
attendance-mcp = "attendance_mcp:main"

[build-system]
requires = ["uv_build>=0.9.16,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.16.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 88
target-version = "py312"
